<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ .title }}</title><link rel="stylesheet" href="/static/css/main.css"><link rel="stylesheet" href="/static/css/failures.css"><link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="admin-app"><nav class="navbar"><a href="/dashboard" class="navbar-brand">基礎設施管理系統</a><ul class="navbar-nav"><li class="nav-item"><a class="nav-link" href="/dashboard">儀表板</a></li><li class="nav-item"><a class="nav-link" href="/failures" aria-current="page">失敗紀錄</a></li><li class="nav-item"><a class="nav-link" href="/users">使用者</a></li><li class="nav-item"><a class="nav-link" href="/services">服務</a></li><li class="nav-item"><a class="nav-link" href="/tokens">Token</a></li><li class="nav-item"><a class="nav-link" href="/change-password">修改密碼</a></li><li class="nav-item"><a class="nav-link" href="/logout">登出</a></li></ul></nav>
<main class="container"><header class="failure-header"><div><h1>失敗紀錄</h1><p>查看驗證、連線與上游回應的失敗原因。最多保留 90 天或 100,000 筆，容量滿時刪除最舊紀錄。</p></div><button class="btn btn-primary" id="refreshFailures">重新整理</button></header><section class="failure-panel"><div class="failure-filter"><div><label for="failureStage">失敗類型</label><select id="failureStage"><option value="">全部類型</option><option value="authentication">驗證失敗</option><option value="local">本系統錯誤</option><option value="upstream_connection">上游連線失敗</option><option value="upstream_response">上游回應失敗</option><option value="transfer">傳輸中斷</option></select></div><div><label for="failureService">服務</label><select id="failureService"><option value="">全部服務</option></select></div><div><label for="failureCode">回應碼</label><input type="number" min="100" max="999" id="failureCode" placeholder="例如 503"></div><div><label for="failureUpstreamCode">上游回應碼</label><input type="number" min="100" max="999" id="failureUpstreamCode" placeholder="例如 503"></div><div><label for="failureFrom">開始日期</label><input type="date" id="failureFrom"></div><div><label for="failureTo">結束日期</label><input type="date" id="failureTo"></div><button id="applyFilters" class="btn btn-primary">查詢</button></div><p id="failureMessage" role="status">載入中…</p><div class="failure-table"><table class="table"><thead><tr><th>時間</th><th>類型</th><th>原因</th><th>服務</th><th>回應碼</th><th>上游回應碼</th></tr></thead><tbody id="failureRows"></tbody></table></div><div class="failure-pagination"><button id="previousPage" class="btn" disabled>上一頁</button><span id="pageNumber">第 1 頁</span><button id="nextPage" class="btn" disabled>下一頁</button></div></section><p class="failure-note">新功能啟用前的失敗無法補回。傳輸中斷可能發生在回應送出後，因此回應碼仍可能是 200，且來源未必能確定。</p></main><script src="/static/js/failures.js"></script><script src="/static/js/admin.js"></script>
</body></html>
