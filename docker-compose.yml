services:
  app:
    image: infra-manager:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "1452:8080"
    environment:
      - GIN_MODE=release
    volumes:
      - type: bind
        source: ${DATA_DIR:?請設定 DATA_DIR}
        target: /app/data
        bind:
          create_host_path: true
    restart: always
    networks:
      - infra-net

networks:
  infra-net:
    external: true
